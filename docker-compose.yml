services:
  # This service runs your main Streamlit application
  app:
    profiles: ["legacy"]   # superseded by the `explorer` service
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    env_file:
      - .env

  # This service is for the one-time data conversion task
  converter:
    profiles: ["legacy"]   # superseded by `python -m adsb.ingest`
    build:
      context: .
      dockerfile: docker/Dockerfile # It uses the exact same image as the app
    volumes:
      # It also needs the data folder to read raw files and write the processed file
      - ./data:/app/data
    # This overrides the default CMD to run our conversion script instead of Streamlit
    command: python src/convert_to_parquet.py

  # Object storage for the new pipeline. S3-compatible, so the pipeline talks
  # to it with the same s3a:// connector and boto3 client it would use for AWS.
  # Credentials are local dev defaults on purpose; override them in .env.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # New ADS-B pipeline: PySpark in local mode. Separate image from the two
  # services above, which stay Spark-free.
  spark:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # The dedup that needed a large driver heap -- a window over every
      # distinct icao+event_time -- now happens inside each aircraft's trace
      # array during decoding, so nothing shuffles for it. The segmentation
      # window is what the heap is for now. Raise it for bigger samples:
      # SPARK_DRIVER_MEMORY=12g docker compose ...
      PYSPARK_SUBMIT_ARGS: --driver-memory ${SPARK_DRIVER_MEMORY:-4g} pyspark-shell
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-adsb}
      # one root for every table; point it at a scratch prefix for development
      # runs so exploratory rebuilds never tombstone the real tables
      ADSB_ROOT: ${ADSB_ROOT:-s3a://${S3_BUCKET:-adsb}}
      ADSB_RAW_URI: s3a://${S3_BUCKET:-adsb}/raw/adsb
      ADSB_AIRPORTS_URI: s3a://${S3_BUCKET:-adsb}/reference/airports.csv
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml

  # Spark vs pandas benchmark. Its own image: the pipeline image stays
  # pandas-free, and both engines have to run on the same CPU and disk to be
  # comparable. Not part of a default `docker compose up`.
  bench:
    profiles: ["bench"]
    build:
      context: .
      dockerfile: docker/Dockerfile.bench
    environment:
      PYSPARK_SUBMIT_ARGS: --driver-memory ${SPARK_DRIVER_MEMORY:-4g} pyspark-shell
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./bench:/app/bench

  # Flight Explorer: reads the published tables, computes nothing.
  explorer:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-adsb}
      ADSB_ROOT: ${ADSB_ROOT:-s3a://${S3_BUCKET:-adsb}}
    ports:
      - "8502:8501"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml

volumes:
  minio-data: