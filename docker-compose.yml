services:
  # This service runs your main Streamlit application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    env_file:
      - .env

  # This service is for the one-time data conversion task
  converter:
    build:
      context: .
      dockerfile: docker/Dockerfile # It uses the exact same image as the app
    volumes:
      # It also needs the data folder to read raw files and write the processed file
      - ./data:/app/data
    # This overrides the default CMD to run our conversion script instead of Streamlit
    command: python src/convert_to_parquet.py

  # Object storage for the new pipeline. S3-compatible, so the pipeline talks
  # to it with the same s3a:// connector and boto3 client it would use for AWS.
  # Credentials are local dev defaults on purpose; override them in .env.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # New ADS-B pipeline: PySpark in local mode. Separate image from the two
  # services above, which stay Spark-free.
  spark:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # Spark's default 1g driver heap OOMs on the Silver dedup (a window over
      # every distinct icao+event_time) once the dataset is a few million rows.
      # Raise it for bigger samples: SPARK_DRIVER_MEMORY=12g docker compose ...
      PYSPARK_SUBMIT_ARGS: --driver-memory ${SPARK_DRIVER_MEMORY:-4g} pyspark-shell
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-adsb}
      ADSB_RAW_URI: s3a://${S3_BUCKET:-adsb}/raw/adsb
      ADSB_BRONZE_URI: s3a://${S3_BUCKET:-adsb}/bronze/observations
      ADSB_SILVER_URI: s3a://${S3_BUCKET:-adsb}/silver/observations
      ADSB_FLIGHTS_URI: s3a://${S3_BUCKET:-adsb}/silver/flight_segments
      ADSB_AIRPORTS_URI: s3a://${S3_BUCKET:-adsb}/reference/airports.csv
      ADSB_GOLD_URI: s3a://${S3_BUCKET:-adsb}/gold/airport_daily_operations
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml

volumes:
  minio-data: